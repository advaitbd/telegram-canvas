<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Canvas</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main id="app">
    <header class="masthead">
      <h1>Canvas</h1>
    </header>
    <div id="loading-screen" class="screen loading-state" role="status">Opening canvas…</div>
    <section id="session-picker" class="screen hidden" aria-labelledby="picker-title">
      <div class="title-row"><h2 id="picker-title">Your sessions</h2><p id="session-count" class="canvas-count"></p></div>
      <ul id="session-list" class="list" aria-label="Canvas sessions"></ul>
      <button id="open-management" class="secondary-button" type="button">Browse all canvases</button>
    </section>
    <section id="canvas-management" class="screen hidden" aria-labelledby="management-title">
      <div class="action-row"><button id="back-to-management" class="text-button" type="button">← All canvases</button></div>
      <div class="title-row"><h2 id="management-title">All canvases</h2><p id="management-count" class="canvas-count"></p></div>
      <ul id="canvas-list" class="list" aria-label="All canvases"></ul>
    </section>
    <section id="artifact-gallery" class="screen hidden" aria-labelledby="gallery-title">
      <div class="action-row"><button id="gallery-back-to-sessions" class="text-button" type="button">← Sessions</button></div>
      <h2 id="gallery-title">Artifacts</h2>
      <ul id="artifact-list" class="list" aria-label="Artifacts in this session"></ul>
    </section>
    <section id="artifact-viewer" class="screen hidden" aria-labelledby="viewer-title">
      <h2 id="viewer-title" class="visually-hidden">Canvas artifact</h2>
      <div id="iframe-container"><iframe id="artifact-iframe" title="Canvas artifact" sandbox="allow-scripts" loading="lazy"></iframe></div>
      <button id="back-to-gallery" class="viewer-control viewer-back" type="button" aria-label="Back to session artifacts">←</button>
      <button id="viewer-menu-toggle" class="viewer-control viewer-menu-toggle" type="button" aria-label="Canvas actions" aria-controls="viewer-menu" aria-expanded="false">•••</button>
      <section id="viewer-menu" class="viewer-menu" aria-label="Canvas actions" hidden>
        <label class="visually-hidden" for="revision-selector">Revision</label>
        <select id="revision-selector" class="revision-picker"></select>
        <button id="browse-all" class="secondary-button" type="button">Browse all canvases</button>
        <button id="btn-download" class="secondary-button" type="button">Download</button>
        <button id="btn-extend" class="secondary-button" type="button">Extend 30d</button>
        <label class="visually-hidden" for="share-duration">Public share duration</label>
        <select id="share-duration" class="revision-picker"><option value="86400">Share publicly for 1 day</option><option value="604800">Share publicly for 7 days</option><option value="2592000" selected>Share publicly for 30 days</option></select>
        <button id="btn-share" class="secondary-button" type="button">Create public link</button>
        <div id="public-share-list" class="share-list" aria-live="polite"></div>
        <button id="btn-delete" class="danger-button" type="button">Delete</button>
      </section>
    </section>
    <section id="error-screen" class="screen hidden" aria-live="assertive">
      <p id="error-message" class="error-text"></p><button id="btn-retry" class="secondary-button" type="button">Retry</button>
    </section>
  </main>
  <script type="module" src="/app.ts"></script>
</body>
</html>
