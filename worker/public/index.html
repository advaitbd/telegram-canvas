<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Canvas</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main id="app">
    <header class="masthead">
      <p class="eyebrow">HERMES / CANVAS</p>
      <h1>Canvas</h1>
    </header>
    <div id="loading-screen" class="screen" role="status">Opening your latest canvas…</div>
    <section id="session-picker" class="screen hidden" aria-labelledby="picker-title">
      <div class="title-row"><div><p class="eyebrow">ARCHIVE</p><h2 id="picker-title">All canvases</h2></div></div>
      <ul id="session-list" class="list" aria-label="Canvas sessions"></ul>
    </section>
    <section id="artifact-gallery" class="screen hidden" aria-labelledby="gallery-title">
      <div class="action-row"><button id="back-to-sessions" class="text-button" type="button">← All canvases</button></div>
      <div><p class="eyebrow">SESSION</p><h2 id="gallery-title">Artifacts</h2></div>
      <ul id="artifact-list" class="list" aria-label="Artifacts in this session"></ul>
    </section>
    <section id="artifact-viewer" class="screen hidden" aria-labelledby="viewer-title">
      <div class="action-row"><button id="back-to-gallery" class="text-button" type="button">← Session artifacts</button><button id="browse-all" class="text-button" type="button">Browse all canvases</button></div>
      <div><p id="viewer-session" class="eyebrow">CANVAS</p><h2 id="viewer-title">Viewer</h2></div>
      <div id="viewer-controls" class="controls">
        <label class="visually-hidden" for="revision-selector">Revision</label><select id="revision-selector" class="revision-picker"></select>
        <button id="btn-download" class="secondary-button" type="button">Download</button>
        <button id="btn-extend" class="secondary-button" type="button">Extend 30d</button>
        <button id="btn-delete" class="danger-button" type="button">Delete</button>
      </div>
      <div id="iframe-container"><iframe id="artifact-iframe" title="Canvas artifact" sandbox="allow-scripts" loading="lazy"></iframe></div>
    </section>
    <section id="error-screen" class="screen hidden" aria-live="assertive">
      <p id="error-message" class="error-text"></p><button id="btn-retry" class="secondary-button" type="button">Retry</button>
    </section>
  </main>
  <script type="module" src="/app.ts"></script>
</body>
</html>
